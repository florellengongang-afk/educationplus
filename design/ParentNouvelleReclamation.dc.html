<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Parent — Nouvelle réclamation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D45}a:hover{color:#07402F}
button,select,textarea{font-family:inherit}
textarea::placeholder{color:#6B7A73}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F2; color: #0F1F19; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 14px; display: flex; align-items: center; gap: 12px">
    <a href="ParentReclamations.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDE3DF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0F1F19">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Signaler un problème</h1>
  </div>

  <form style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="cat" style="font-size: 14px; font-weight: 700">Type de problème</label>
      <select id="cat" style="height: 48px; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 12px; font-size: 15px; background: #FFFFFF; color: #0F1F19">
        <option>Présence incorrectement enregistrée</option>
        <option>Enseignant absent ou en retard</option>
        <option>Cours non démarré</option>
        <option>Cours marqué terminé sans avoir eu lieu</option>
        <option>Qualité pédagogique</option>
        <option>Problème de comportement</option>
        <option>Sécurité de l'enfant</option>
        <option>Prix ou paiement</option>
        <option>Annulation ou remboursement</option>
        <option>Erreur dans le compte rendu</option>
      </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="seance" style="font-size: 14px; font-weight: 700">Séance concernée</label>
      <select id="seance" style="height: 48px; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 12px; font-size: 15px; background: #FFFFFF; color: #0F1F19">
        <option>Ven. 9 oct. · Maths · Kevin · M. Etoga</option>
      </select>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 6px">
      <legend style="font-size: 14px; font-weight: 700; padding-bottom: 6px">Adresser à</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E3EAE6; padding: 4px; border-radius: 14px">
        <button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 11px; background: transparent; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">Partenaire</button>
        <button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 11px; background: transparent; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">Administration</button>
        <button type="button" aria-pressed="true" style="height: 44px; border: none; border-radius: 11px; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(15,31,25,0.12)">Les deux</button>
      </div>
      <span style="font-size: 12px; color: #4A5B54">Vous pouvez toujours écrire directement à l'administration.</span>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="desc" style="font-size: 14px; font-weight: 700">Que s'est-il passé ?</label>
      <textarea id="desc" rows="4" placeholder="Décrivez le problème en quelques phrases" style="resize: none; border: 1px solid #C9D3CE; border-radius: 12px; padding: 10px 12px; font-size: 15px; background: #FFFFFF; color: #0F1F19"></textarea>
    </div>

    <button type="button" style="height: 44px; border-radius: 12px; border: 1px dashed #8A9A93; background: transparent; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>Joindre une photo ou un document</button>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: #F8E4E1; border-radius: 14px; padding: 12px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span style="font-size: 13px; line-height: 1.4; color: #5C1914">Un problème de <strong>sécurité de l'enfant</strong> est toujours transmis en priorité à l'administration.</span>
    </div>
  </form>

  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE3DF">
    <a href="ParentSuccesReclamation.dc.html" style="height: 54px; border-radius: 14px; background: #0F1F19; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Envoyer la réclamation</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }

</body>
</html>

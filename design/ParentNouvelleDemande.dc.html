<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Parent — Nouvelle demande de cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D45}a:hover{color:#07402F}
button,input,select{font-family:inherit}
input::placeholder{color:#6B7A73}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F2; color: #0F1F19; font-family: 'Figtree', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DDE3DF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0F1F19">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Nouvelle demande de cours</h1>
  </div>

  <form style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 700">Pour quel enfant ?</span>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 42px; padding: 0 16px; border-radius: 21px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">Kevin · 3e</button>
        <button type="button" aria-pressed="true" style="height: 42px; padding: 0 16px; border-radius: 21px; border: 1px solid #0F1F19; background: #0F1F19; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Aïcha · CM2</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 700">Matières</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #0B5D45; background: #0B5D45; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">Français</button>
        <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #0B5D45; background: #0B5D45; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">Maths</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 13px; font-weight: 600; cursor: pointer">Anglais</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 13px; font-weight: 600; cursor: pointer">Sciences</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="true" style="height: 56px; border-radius: 14px; border: 2px solid #0B5D45; background: #E3EFEA; color: #07402F; font-size: 15px; font-weight: 700; cursor: pointer">À domicile</button>
      <button type="button" aria-pressed="false" style="height: 56px; border-radius: 14px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 15px; font-weight: 600; cursor: pointer">Centre de cours</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="zone" style="font-size: 14px; font-weight: 700">Quartier / zone</label>
      <input id="zone" value="Bastos, Yaoundé" style="height: 46px; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 14px; font-size: 15px; background: #FFFFFF; color: #0F1F19">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 700">Jours souhaités</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <button type="button" aria-label="Lundi" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">L</button>
        <button type="button" aria-label="Mardi" aria-pressed="true" style="height: 44px; border-radius: 12px; border: 1px solid #0B5D45; background: #0B5D45; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">M</button>
        <button type="button" aria-label="Mercredi" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">M</button>
        <button type="button" aria-label="Jeudi" aria-pressed="true" style="height: 44px; border-radius: 12px; border: 1px solid #0B5D45; background: #0B5D45; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">J</button>
        <button type="button" aria-label="Vendredi" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">V</button>
        <button type="button" aria-label="Samedi" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">S</button>
        <button type="button" aria-label="Dimanche" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #C9D3CE; background: #FFFFFF; color: #0F1F19; font-size: 14px; font-weight: 600; cursor: pointer">D</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="h" style="font-size: 14px; font-weight: 700">Horaire</label>
        <select id="h" style="height: 46px; min-width: 0; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 10px; font-size: 15px; background: #FFFFFF; color: #0F1F19"><option>15h – 17h</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="duree" style="font-size: 14px; font-weight: 700">Durée du programme</label>
        <select id="duree" style="height: 46px; min-width: 0; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 10px; font-size: 15px; background: #FFFFFF; color: #0F1F19"><option>3 mois</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="debut" style="font-size: 14px; font-weight: 700">Démarrage</label>
        <input id="debut" type="date" value="2026-10-20" style="height: 46px; min-width: 0; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 10px; font-size: 15px; background: #FFFFFF; color: #0F1F19">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="budget" style="font-size: 14px; font-weight: 700">Budget (facultatif)</label>
        <input id="budget" placeholder="FCFA / mois" style="height: 46px; min-width: 0; border: 1px solid #C9D3CE; border-radius: 12px; padding: 0 12px; font-size: 15px; background: #FFFFFF; color: #0F1F19">
      </div>
    </div>
  </form>

  <div style="padding: 12px 20px 24px; border-top: 1px solid #DDE3DF; display: flex; flex-direction: column; gap: 6px">
    <a href="ParentSuccesDemande.dc.html" style="height: 54px; border-radius: 14px; background: #0B5D45; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Publier la demande</a>
    <span style="font-size: 12px; color: #4A5B54; text-align: center">Jusqu'à 10 enseignants compatibles pourront se proposer.</span>
  </div>
</div>
</x-dc>

</html>

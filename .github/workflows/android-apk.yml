name: APK Android

# Construit une APK installable (signée avec la clé de debug — pour les tests uniquement).
# Lancement : à chaque push sur main touchant l'app mobile, ou à la main (onglet Actions > APK Android > Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/ui-tokens/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est préinstallé sur les machines Ubuntu de GitHub.
      - name: Configurer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > /tmp/local.properties
      - run: pnpm install --frozen-lockfile
      - name: Générer le projet Android
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cp /tmp/local.properties android/local.properties
      - name: Compiler l'APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: educationplus-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
